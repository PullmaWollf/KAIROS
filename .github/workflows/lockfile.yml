name: Atualizar lockfile
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-lockfile:
    if: github.repository == 'PullmaWollf/KAIROS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Gerar lockfile reproduzível
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Versionar lockfile
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m "chore(deps): lock dependencies for reproducible installs"
          git push
